; DLSSG SM86 - frame generation for Ampere (RTX 30) and newer.
; Copy version.dll, this INI and the dlssg_sm86\ folder beside the rendering EXE. Use ONE proxy DLL at a time:
; version.dll first. Only if the game never loads it, delete it and try the proxies in alternatives\ one by one, in this
; order: winmm.dll, dbghelp.dll, dinput8.dll, then dxgi.dll or d3d12.dll (render-path proxies: last resort, never both).
; See alternatives\README.md.
; The DLSS-G runtime, the SM86 backend, the kernel packs and the super-resolution snippet are FILES under dlssg_sm86\,
; found relative to the proxy's own folder - nothing is embedded and nothing is ever written to %LOCALAPPDATA%. Restart
; the game after changing this file.
; This is the full release configuration: four consistency tiers. Every diagnostic / compatibility / performance knob
; still works but is left out here and takes its safe, validated default; the complete list is in docs\INSTALL.md / INSTALL.en.md
; (advanced / diagnostic keys).
; A value that is invalid or out of range is never replaced by a default: the log gets one configuration_invalid and the
; feature it belongs to is not enabled (frame generation as with Enabled=0, super resolution as with Mode=Off).
; 值写错或越界不会被换成默认值：日志记一条 configuration_invalid，该键所属功能不启用（帧生成同 Enabled=0，超分同 Mode=Off）。
; RTX 20 (Turing) 用这份文件即可，不需要加任何键：内核族按物理显卡自动选到 SM75，游戏那道架构闸门也自动放行。
; 其余进阶键（Router / KernelImage / SpoofArchToGame / 抓取与诊断等）全部见 docs\INSTALL.md。
; 两个插帧引擎：公共键在 [FrameGeneration] / [Runtime] / [Logging]，DLSS 专用键在 [DLSSG]，XeSS 专用键在 [XeSSFG]；另一个引擎的键不读。
; Two engines: common keys in [FrameGeneration] / [Runtime] / [Logging], DLSS-only keys in [DLSSG], XeSS-only in [XeSSFG].

[General]
; 1 = frame generation on (our bundled, Ampere-optimized DLSS-G runtime). 0 = off: the game's own DLSS-G loads
; unchanged, which means no frame generation on Ampere. The proxy still forwards the real system DLL either way.
Enabled=1

[FrameGeneration]
; Engine: DLSS = NVIDIA's DLSS-G model on this project's SM86/SM75 kernels (default). XeSS = Intel's XeSS-FG model 15
; (as ported by MFG-Unlocker 1.6.0; its 2X is model 18) on this project's own runner (dlssg_sm86\xefg\xefg_kernels.dll;
; Intel's libxess_fg.dll is not used): 2X / 3X / 4X (MaxGeneratedFrames 1-3). A back buffer it cannot run (RGBA16F) is
; refused, it never falls back to DLSS.
; 插帧引擎：DLSS = NVIDIA DLSS-G 模型（本项目的 SM86/SM75 内核，默认）；XeSS = Intel XeSS-FG model 15（MFG-Unlocker 1.6.0
; 的移植，2X 是 model 18）在本项目自己的运行器上跑，不用 Intel 的 libxess_fg.dll：2X / 3X / 4X（MaxGeneratedFrames 1-3）；
; 它跑不了的后缓冲格式（RGBA16F）直接拒绝，不退回 DLSS。
Engine=DLSS
; Generated frames per real frame: 3 = 4X (factory default), 5 = 6X (the most the bundled runtime 310.9.16 supports).
; A requirement, not a hint: it is advertised to the game exactly (a driver profile cannot lower it), and the game's own
; menu may pick less. Where it cannot be served (above 5, above 3 under Engine=XeSS, an old 2X-only game plugin) frame
; generation is not enabled and the log says why (max_generated_frames_unsupported). A game whose own Streamline plugin
; is 4X stays at 4X either way.
; 每个真实帧生成几帧：3 = 4X（出厂），5 = 6X（随包运行库 310.9.16 的上限）。这是要求不是上限：原样告诉游戏（驱动 profile
; 压不低它），游戏菜单可以选更低。做不到时（超过 5、Engine=XeSS 时超过 3、只能 2X 的旧插件）帧生成不启用并在日志里说明。
MaxGeneratedFrames=3

[DLSSG]
; Read only by Engine=DLSS. / 只对 Engine=DLSS 生效。
; Consistency tier: how far the generated image may move from what the official NVIDIA runtime would produce. The old
; places [FrameGeneration] Optimized / [Compatibility] OptimizedKernels are no longer read.
; 一致性档位：允许生成的画面偏离官方运行库多远。数字越大越快、离官方画面越远。旧位置 [FrameGeneration] Optimized /
; [Compatibility] OptimizedKernels 不再读取。
; 0 = stock, the runtime's original numerics only / 原厂内核，不做任何加速（最保守）
; 1 = every acceleration that keeps the output BIT-IDENTICAL to the official runtime (default)
;     / 默认：全部逐位一致的加速（画面与官方完全相同）
; 2 = tier 1 plus lossy image kernels. Not bit-identical: 44-53 dB PSNR against the official output on real 4K
;     captures, lowest on the fastest motion; side by side against ground truth, no difference from tier 1 was visible.
;     / 在档位 1 上再加有损图像内核。不再逐位一致：真实 4K 抓取上对官方输出 PSNR 44-53 dB（运动越快越低）；
;     对着真值并排看，与档位 1 看不出差别。
; 3 = everything lossy that is still faster / 全部有损加速（画质代价最大，最快）
; Tiers 2 and 3 are not bit-exact. / 档位 2、3 不再逐位一致。
Optimized=1
; DLSS-G render preset. What is written here runs, whatever the game or a driver profile asks for.
; A (default) = UI recomposition off, FG Lite off. B = UI recomposition on (cleaner HUD/UI inside generated frames), but
; only when the game hands DLSS-G both a HUD-less image and a UI plane; most games do not, and then B looks like A.
; C = FG Lite: lighter candidate blending, about 32-54 % less GPU time per generated frame, slightly lower image quality
; (mostly on the HUD and at occlusion edges); uses this project's accelerated kernels like the default.
; Auto was removed on 2026-10-22 (it runs as A); the old place [Compatibility] Preset is no longer read.
; 渲染预设：这里写什么就跑什么，游戏或驱动配置要别的也不变。A（默认）= 不做 UI 重组、不开轻量插帧；B = UI 重组（游戏同时
; 交出无 HUD 画面和 UI 平面时才有效果，多数游戏不交，那时与 A 相同）；C = 轻量插帧：每个生成帧 GPU 时间约少 32-54 %，
; 画质略低（主要在 HUD 与遮挡边缘）。Auto 已于 2026-10-22 删除（按 A）；旧位置 [Compatibility] Preset 不再读取。
Preset=A

[XeSSFG]
; Read only by Engine=XeSS. / 只对 Engine=XeSS 生效。
; Optical-flow resolution: Coarse / Middle / Fine; finer is slower. / 光流分辨率：Coarse / Middle / Fine，越细越慢。
; CoarseAt4K = Coarse when the output has >= 3840x2160 pixels, else Middle. / CoarseAt4K = 输出像素 >= 3840x2160 时 Coarse，否则 Middle。
FlowResolution=Middle
; Auto = when the game supplies a HUD-less image, feed it to the network and composite the UI, else run as 0 (default);
; 1 = always (a game that supplies none ends with an error); 0 = never.
; Auto = 游戏给了无 HUD 画面就用它做网络输入并合成 UI，没给时按 0（默认）；1 = 一律用（游戏没给就报错退出）；0 = 不用。
UseHudless=Auto
; (The model is Intel's model 15 as ported by MFG-Unlocker 1.6.0 - MIT; 46 of its programs fall under Intel's XeSS SDK
; terms, THIRD_PARTY_NOTICES.txt - whose 2X is model 18; it ships inside xefg_kernels.dll. The Model key was removed on
; 2026-10-26 and is not read. RTX 3070, 4X: faster than DLSS default at 1440p, slower at 4K.)
; （模型是 MFG-Unlocker 1.6.0 移植的 Intel model 15——MIT；其中 46 个程序归 Intel XeSS SDK 条款，见 THIRD_PARTY_NOTICES.txt——
; 2X 是 model 18，随包在 xefg_kernels.dll 里。Model 键 2026-10-26 删除，不再读取。RTX 3070 4X：1440p 比 DLSS 默认快，4K 比它慢。）

[Logging]
; 0 = off, 1 = errors, 2 = configuration and capability, 3 = kernel and evaluation traces. Written to Directory.
; One file, Directory\dlssg_sm86.log, shared by every module of every process; each line starts with the local time,
; pid, EXE name and level letter (E = 1, I = 2, D = 3), then the JSON record. Filter by EXE name or pid for one game.
; 0 = 关闭，1 = 错误，2 = 配置与能力，3 = 内核与 Evaluate 追踪。所有模块、所有进程都追加写 Directory\dlssg_sm86.log 这一个文件；
; 每行先是本地时间、pid、EXE 名和级别字母（E = 1 / I = 2 / D = 3），再是 JSON 记录；只看一个游戏时按 EXE 名或 pid 过滤。
Level=1
Directory=dlssg_sm86\logs

[Runtime]
; Bundled = the packaged runtime beside this INI, dlssg_sm86\runtime\nvngx_dlssg.dll, with its backend (normal use;
; no game DLL version matching). External / Pinned are advanced, see docs\INSTALL.md. Auto was removed in 0.4.0
; (it runs as Bundled). A runtime that cannot be used - the packaged one missing, or a Path that names a wrong file -
; turns frame generation off with one error in the log; nothing else is loaded in its place. A runtime whose preset
; layout this build does not know is refused at install, whatever [DLSSG] Preset says.
; 运行库来源：Bundled = 随包的 310.9.16（正常用这个）；Auto 已在 0.4.0 删除（按 Bundled）。运行库用不了（随包的缺失、Path 指错文件）时帧生成不启用，日志记一条错误，不会改用别的运行库；预设布局本构建不认识的运行库在安装时即被拒绝，不论 [DLSSG] Preset 写什么。
Mode=Bundled

[SuperResolution]
; DLSS Super Resolution, RTX 30 / RTX 20 only. Off = not touched (default). M-INT8 / L-INT8 = preset M / L on every
; quality mode (the game's menu picks the mode), run on this project's INT8 kernels; M-FP16 / L-FP16 = the same preset on
; NVIDIA's own kernels. On Quality / Balanced / DLAA, M or L is slower than the game's own preset K.
; 超分（仅 RTX 30 / 20）：Off = 不介入（默认）；M-INT8 / L-INT8 = 所有画质档都用预设 M / L（档位在游戏里选），跑本项目的
; INT8 内核；M-FP16 / L-FP16 = 同一预设、NVIDIA 自己的内核。画质 / 平衡 / DLAA 档用 M / L 比游戏自己的 K 慢。
Mode=Off
