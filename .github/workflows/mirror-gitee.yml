name: Mirror reviewed sources and releases to Gitee
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional stable release tag, for example v4.2.3; signed EXE must already be on Gitee'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: rtxfg-cloud-publish
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'pandaligx/RTX-FG-Manager' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source and stable-release mirror tests
        run: python -m unittest discover -s tests -p test_publication.py -v
      - name: Fast-forward reviewed source history and verify locally uploaded EXE
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: pandaligx
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: python .github/scripts/mirror_gitee.py
