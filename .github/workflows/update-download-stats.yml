name: Update combined download badge
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rtxfg-download-stats
  cancel-in-progress: false
jobs:
  stats:
    if: github.repository == 'pandaligx/RTX-FG-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: rtxfg-gitcode-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify aggregation and source publication guards
        run: |
          python -B -m unittest discover -s tests -p test_download_stats.py -v
          python -B -m unittest discover -s tests -p test_publication.py -v
      - name: Refresh complete public statistics
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: python -B tools/update_download_stats.py
      - name: Commit badge and source counts together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/download-stats.json docs/downloads-total.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh combined download count [skip ci]'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not trigger push workflows; mirror explicitly.
      - name: Mirror updated documentation to GitCode
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          RTXFG_RESOURCE_RECEIPTS: ${{ vars.RTXFG_RESOURCE_RECEIPTS }}
          RELEASE_TAG: ''
        run: python -B tools/gitcode_ci.py
