<main><p class="eyebrow">RTX FG MANAGER</p><h1>让合适的设置更容易找到。</h1><p>在管理器的游戏详情中浏览、预览和分享配置。不同补丁的参数各自独立；硬件相似度仅供参考，实际效果仍需在游戏内确认。</p><div class="card"><h2>你的配置，由你决定</h2><p>浏览时在本机匹配硬件；发布前逐项确认提交内容。游戏路径、日志、系统用户名和私钥不上传。</p><p>本社区独立运行，不连接 RTX Encore Hub 的私人服务。</p></div><p><a href="https://github.com/pandaligx/RTX-FG-Manager">项目与下载 ↗</a></p><small>社区正在准备上线。尚未开放客户端发布。</small></main></html>
