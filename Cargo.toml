[package]
name = "rtx-fg-manager"
version = "4.2.7"
edition = "2024"
publish = false
build = "rust/build.rs"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "rust/**",
    "tests/*.rs",
    "tests/fixture-manifest.json",
    "tests/fixtures/catalog*/**",
    "app/assets/**",
    "app/locales/**",
    "app/tools/**",
    "vendor/**",
    "tools/**",
    "BUILDING.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.txt",
]

[features]
default = []
# Real signed artifacts are prepared explicitly; never required for a normal build.
fixture-tests = []
# Optional native GPU diagnostics require locally supplied licensed SDK headers.
native-probes = []

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "RTXManager"
path = "rust/src/main.rs"

[dependencies]
anyhow = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
base64 = "0.22"
chrono = "0.4"
# The Kit facade keeps the core, platform, components and assets on one backend.
# Upgraded from the old Zed/Component snapshots; pin this reviewed source for reproducibility.
gpui = { package = "gpui-kit", git = "https://github.com/longbridge/gpui-kit", rev = "4921e5b69834e45592c9772c57f39a29ada7de2f", features = ["gpui-fast"] }
smol = "2"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
libloading = "0.8"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
uuid = { version = "1", features = ["v4"] }
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi_Common", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Globalization"] }

[build-dependencies]
cc = "1"
flate2 = "1.1"
sha2 = "0.10"
winres = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[patch.crates-io]
gpui-fast-windows = { path = "vendor/gpui_fast_windows" }
