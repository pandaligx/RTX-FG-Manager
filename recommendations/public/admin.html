<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推荐方案管理 | RTX-FG-Manager</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body><div class="app-shell"><aside class="sidebar" aria-label="主导航"><div class="brand"><img src="/icons/manager.svg" alt="" width="32" height="32"><div><strong>RTX-FG-Manager</strong><span>推荐方案管理</span></div></div><nav><button id="nav-recipes" class="nav-item active" aria-current="page"><img src="/icons/list.svg" alt="">方案管理</button><button id="nav-games" class="nav-item"><img src="/icons/gamepad.svg" alt="">游戏归类</button><button id="nav-reports" class="nav-item"><img src="/icons/shield.svg" alt="">举报处理</button></nav><p id="mail-status" class="service-status" role="status">正在检查验证码服务…</p></aside><main>
<header class="page-header"><div><h1 id="page-title">推荐方案管理</h1><p>查看玩家分享，整理游戏归类，处理举报。</p></div><div class="header-actions"><span id="today"></span><button id="refresh" class="icon-button" title="刷新" aria-label="刷新"><img src="/icons/refresh-cw.svg" alt=""></button><button id="logout" hidden><img src="/icons/log-out.svg" alt="">退出登录</button></div></header><p id="status" role="status" aria-live="polite"></p>
<form id="login" class="login-panel"><img src="/icons/manager.svg" alt="" width="44" height="44"><h2>管理员登录</h2><p class="muted">使用管理员邮箱接收验证码</p><label for="email">管理员邮箱</label><div class="email-row"><input id="email" type="text" autocomplete="email" required maxlength="254" placeholder="邮箱账号或完整邮箱"><select id="domain" aria-label="邮箱后缀"><option value="qq.com">@qq.com</option><option value="163.com">@163.com</option><option value="126.com">@126.com</option><option value="outlook.com">@outlook.com</option><option value="gmail.com">@gmail.com</option><option value="">其他邮箱</option></select></div><small id="email-preview" aria-live="polite"></small><button id="send" type="button">发送验证码</button><label for="code">验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit" class="primary">登录</button></form>
<section id="review" hidden><div id="recipe-workspace" class="workspace"><section class="list-pane" aria-label="方案列表"><form id="search"><div class="search-box"><img src="/icons/search.svg" alt=""><input id="query" aria-label="搜索游戏或方案名称" placeholder="搜索游戏、方案名称或游戏 ID" maxlength="120"><button class="sr-only">搜索</button></div><div class="filter-row"><select id="filter" aria-label="筛选方案"><option value="all">全部方案</option><option value="visible">公开方案</option><option value="hidden">已隐藏</option><option value="reported">有举报</option><option value="duplicates">疑似重复</option></select><span class="muted">最近更新</span></div></form><p id="count" class="list-count"></p><div id="cards"></div><nav class="pagination" aria-label="列表分页"><button id="previous">上一页</button><button id="next">下一页</button></nav></section><section id="detail" class="detail-pane" aria-label="方案详情"><p class="empty">选择方案查看详情</p></section></div>
<section id="game-directory" class="game-directory" hidden><h2>游戏名称与归类</h2><p class="muted">只关联同一款游戏。原版、续作和重制版请分别保留；方案、作者与评价保持不变。</p><form id="game-search"><input id="game-query" aria-label="搜索待归类游戏" maxlength="120" placeholder="中文名、英文名或平台 ID"><button>搜索游戏</button></form><div id="game-results"></div><p id="game-selection" class="meta"></p><button id="game-preview" disabled>预览关联</button><div id="game-plan" hidden><p id="game-plan-text"></p><button id="game-merge" class="primary">确认关联为同一游戏</button></div><p id="game-history" class="meta"></p><button id="game-undo" disabled>撤销最近一次关联</button></section></section></main></div></body></html>
