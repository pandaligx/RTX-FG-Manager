<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玩家推荐方案 · 管理</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body><main><header><span>RTX-FG-Manager</span><h1>推荐方案管理</h1><p>查看全部分享，处理重复方案与玩家举报。</p><p id="mail-status" class="muted" role="status">正在检查验证码服务…</p></header>
<form id="login"><label for="email">管理员邮箱</label><div class="email-row"><input id="email" type="text" autocomplete="email" required maxlength="254" placeholder="邮箱账号或完整邮箱"><select id="domain" aria-label="邮箱后缀"><option value="qq.com">@qq.com</option><option value="163.com">@163.com</option><option value="126.com">@126.com</option><option value="outlook.com">@outlook.com</option><option value="gmail.com">@gmail.com</option><option value="">其他邮箱</option></select></div><small id="email-preview" aria-live="polite"></small><button id="send" type="button">发送验证码</button><label>验证码<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button type="submit" class="primary">登录</button></form>
<p id="status" role="status" aria-live="polite"></p><section id="review" hidden><nav><h2>全部方案</h2><button id="refresh">刷新</button><button id="logout">退出登录</button></nav>
<details id="game-directory"><summary>游戏归类 · 整理玩家提交的名称</summary><p class="muted">只关联确定为同一款游戏的名称与平台。原版、续作和重制版请分别保留。关联保留方案、作者、评价和审核状态。</p>
<form id="game-search"><input id="game-query" aria-label="搜索待归类游戏" maxlength="120" placeholder="输入中文名、英文名或平台 ID"><button>搜索游戏</button></form><div id="game-results"></div><p id="game-selection" class="meta"></p><button id="game-preview" disabled>预览关联</button><div id="game-plan" hidden><p id="game-plan-text"></p><button id="game-merge" class="primary">确认关联为同一游戏</button></div><p id="game-history" class="meta"></p><button id="game-undo" disabled>撤销最近一次关联</button></details>
<form id="search"><input id="query" aria-label="搜索游戏或方案名称" placeholder="搜索游戏、方案名称或游戏 ID" maxlength="120"><select id="filter" aria-label="筛选方案"><option value="all">全部</option><option value="visible">公开</option><option value="hidden">已隐藏</option><option value="reported">有举报</option><option value="duplicates">疑似重复</option></select><button>搜索</button></form><p class="muted">疑似重复仅供人工比较，不会自动删除。想暂时下架可用“隐藏方案”，后续可以恢复。</p><p id="count" class="meta"></p><div id="cards"></div><nav class="pagination"><button id="previous">上一页</button><button id="next">下一页</button></nav></section></main></body></html>
