# Vendored from zed 1d217ee39d381ac101b7cf49d3d22451ac1093fe (Apache-2.0).
# Local changes: first-frame window visibility and Windows 10 compatibility.
[package]
name = "gpui_windows"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
[lib]
path = "src/gpui_windows.rs"
[features]
default = ["gpui/default"]
scap = ["dep:scap"]
screen-capture = ["gpui/screen-capture","scap"]
test-support = ["gpui/test-support"]
[dependencies.gpui]
git = "https://github.com/zed-industries/zed"
rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe"
default-features = false
[target.'cfg(target_os = "windows")'.dependencies.accesskit]
version = "^0.24.0"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.accesskit_windows]
version = "^0.32.1"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.anyhow]
version = "^1.0.86"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.collections]
git = "https://github.com/zed-industries/zed"
rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.etagere]
version = "^0.2"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.futures]
version = "^0.3.32"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.image]
version = "^0.25.1"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.itertools]
version = "^0.14.0"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.log]
version = "^0.4.16"
default-features = true
features = ["kv_unstable_serde","serde"]
[target.'cfg(target_os = "windows")'.dependencies.parking_lot]
version = "^0.12.1"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.rand]
version = "^0.9"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.raw-window-handle]
version = "^0.6"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.scap]
package = "zed-scap"
git = "https://github.com/zed-industries/scap"
rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac"
default-features = false
optional = true
[target.'cfg(target_os = "windows")'.dependencies.smallvec]
version = "^1.6"
default-features = true
features = ["union","const_new"]
[target.'cfg(target_os = "windows")'.dependencies.util]
git = "https://github.com/zed-industries/zed"
rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.uuid]
version = "^1.1.2"
default-features = true
features = ["v4","v5","v7","serde"]
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "^0.61"
default-features = true
features = ["Foundation_Numerics","Globalization_DateTimeFormatting","Storage_Search","Storage_Streams","System_Threading","UI_ViewManagement","Wdk_System_SystemServices","Win32_Foundation","Win32_Globalization","Win32_Graphics_Direct3D","Win32_Graphics_Direct3D11","Win32_Graphics_Direct3D_Fxc","Win32_Graphics_DirectComposition","Win32_Graphics_DirectWrite","Win32_Graphics_DirectManipulation","Win32_Graphics_Dwm","Win32_Graphics_Dxgi","Win32_Graphics_Dxgi_Common","Win32_Graphics_Gdi","Win32_Graphics_Imaging","Win32_Graphics_Hlsl","Win32_Networking_WinSock","Win32_Security","Win32_Security_Credentials","Win32_Security_Cryptography","Win32_Storage_FileSystem","Win32_System_Com","Win32_System_Com_StructuredStorage","Win32_System_Console","Win32_System_Diagnostics_Debug","Win32_System_DataExchange","Win32_System_IO","Win32_System_LibraryLoader","Win32_System_Memory","Win32_System_Ole","Win32_System_Performance","Win32_System_Pipes","Win32_System_RestartManager","Win32_System_SystemInformation","Win32_System_SystemServices","Win32_System_Threading","Win32_System_Variant","Win32_System_WinRT","Win32_UI_Controls","Win32_UI_HiDpi","Win32_UI_Input_Ime","Win32_UI_Input_KeyboardAndMouse","Win32_UI_Input_Pointer","Win32_UI_Shell","Win32_UI_Shell_Common","Win32_UI_Shell_PropertiesSystem","Win32_UI_WindowsAndMessaging","Win32_Media"]
[target.'cfg(target_os = "windows")'.dependencies.windows-core]
version = "^0.61"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.windows-numerics]
version = "^0.2"
default-features = true
[target.'cfg(target_os = "windows")'.dependencies.windows-registry]
version = "^0.5"
default-features = true
[target.'cfg(target_os = "windows")'.build-dependencies.windows-registry]
version = "^0.5"
default-features = true
